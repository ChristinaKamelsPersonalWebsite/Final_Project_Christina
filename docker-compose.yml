services:
  agent-system-a:
    build:
      context: .
      dockerfile: agent_system_a/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - AGENT_SYSTEM_B_URL=http://agent-system-b:8001
      - AGENT_B_URL=http://agent-system-b:8001
      - AGENT_B_TIMEOUT=180
      - MCP_SERVER_URL=http://mcp-server:8002/mcp
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_URL=http://ollama:11434
      - REDIS_URL=redis://redis:6379
    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_started
      agent-system-b:
        condition: service_started
      mcp-server:
        condition: service_started
      redis:
        condition: service_started
      auto-ingest:
        condition: service_completed_successfully
    restart: unless-stopped

  agent-system-b:
    build:
      context: .
      dockerfile: agent_system_b/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:1.5b
      - QDRANT_URL=http://qdrant:6333
      - NUTRITION_COLLECTION=nutrition_guides
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    depends_on:
      ollama:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  mcp-server:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    container_name: mcp-server
    ports:
      - "8002:8002"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama-init.sh:/ollama-init.sh
    entrypoint: ["/bin/sh", "-c", "ollama serve & sh /ollama-init.sh && wait"]
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  auto-ingest:
    build:
      context: .
      dockerfile: agent_system_a/Dockerfile
    command: ["python", "/app/ingest_nutrition.py"]
    volumes:
      - ./data:/app/data
      - ./ingest_nutrition.py:/app/ingest_nutrition.py
    environment:
      - QDRANT_URL=http://qdrant:6333
      - NUTRITION_COLLECTION=nutrition_guides
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
    depends_on:
      qdrant:
        condition: service_started
    restart: "no"

  ingest:
    build:
      context: .
      dockerfile: agent_system_a/Dockerfile
    command: ["python", "/app/ingest_nutrition.py"]
    volumes:
      - ./data:/app/data
      - ./ingest_nutrition.py:/app/ingest_nutrition.py
    environment:
      - QDRANT_URL=http://qdrant:6333
      - NUTRITION_COLLECTION=nutrition_guides
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
    depends_on:
      qdrant:
        condition: service_started
    profiles:
      - ingest

volumes:
  ollama_data:
  qdrant_data:
  huggingface_cache: